ghttp://localhost:8080/dashboard/#/lobal:
  checkNewVersion: false
  sendAnonymousUsage: false

accessLog: {}

log:
  level: DEBUG

api:
  dashboard: true
  insecure: true
  debug: false

entryPoints:
  web:
    address: :80 # L'entrypoint per il traffico HTTP
  websecure:
    address: :443 # Lasciamo questo per il futuro, ma non lo usiamo

